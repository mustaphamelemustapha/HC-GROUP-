[build]
  command = "npm install --prefix frontend && npm run build --prefix frontend"
  publish = "frontend/dist"

# Redirect API calls to the Coolify Backend
[[redirects]]
  from = "/api/*"
  to = "http://37.27.152.61:5001/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
