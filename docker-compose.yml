version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hc-group-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DB_PATH=/app/data/market.db
      - DB_INIT_DIR=/app/database
    volumes:
      - hc_backend_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  hc_backend_data:
    driver: local
